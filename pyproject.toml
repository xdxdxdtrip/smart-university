[project]
name = "smart-university"
version = "1.0.0"
description = "Smart University — система бронирования лабораторного оборудования"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E402"]
"scripts/**" = ["E501"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]
