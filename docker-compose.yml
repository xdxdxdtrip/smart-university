services:
  db:
    image: postgres:16-alpine
    container_name: smartuni-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartuni}
      POSTGRES_DB: ${POSTGRES_DB:-smart_university}
      TZ: Asia/Almaty
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartuni} -d ${POSTGRES_DB:-smart_university}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: production
    container_name: smartuni-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartuni}:${POSTGRES_PASSWORD:-smartuni}@db:5432/${POSTGRES_DB:-smart_university}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key-in-env-file-32+}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@smartuni.kz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      APP_TIMEZONE: Asia/Almaty
    ports:
      - "8000:8000"

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartuni}:${POSTGRES_PASSWORD:-smartuni}@db:5432/smart_university_test

volumes:
  pgdata:
